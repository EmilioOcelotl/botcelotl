# Plantilla. Copia este archivo a data/rutinas.yaml y edítalo:
#   cp data/rutinas.example.yaml data/rutinas.yaml
#
# Rutinas fijas del día.
# - hora: formato 24h "HH:MM", hora local del servidor.
# - dias: opcional. Lista de L,M,X,J,V,S,D. Si se omite, aplica todos los días.
# - tipo: "dashboard" envía el avance de tiempo del día; "auto_cierre" cierra el
#   cronómetro abierto; "resumen" (suspendido) armaba el digest de la agenda.
#   Si no hay tipo, usa "mensaje".
rutinas:
  - hora: "07:00"
    tipo: dashboard
  - hora: "14:00"
    mensaje: "¿Ya comiste? 🍽️"
  - hora: "21:00"
    tipo: dashboard
  - hora: "23:00"
    mensaje: "Cierra la compu 💤"
  - hora: "23:59"
    tipo: auto_cierre

  # Modo agenda suspendido: descomenta para reactivar el resumen de la agenda.
  # - hora: "07:00"
  #   tipo: resumen
